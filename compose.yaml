services:
  web:
    build: .
    image: esteira-labs:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
